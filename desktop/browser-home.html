<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/desktop/assets/i18n-data.js"></script>
  <script src="/desktop/assets/i18n.js"></script>
  <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
  <title data-i18n="browser.title">New Tab</title>
  <!-- The Browser's new tab: a command bar floating over a random photo (Bing's recent images of the day,
       via /api/browser/wallpaper). Offline, it stays plain dark. The desktop sets --tint (the space color,
       used for the highlighted row) on <html> once the page has loaded (tintBrowserHome). -->
  <style>
    :root { --tint: #4263eb; --fg: #f2f2f4; --muted: rgba(242,242,244,.5); color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { display: flex; align-items: flex-start; justify-content: center; padding: max(16px, 22vh) 16px 16px; overflow: hidden;
      font-family: 'Poppins', sans-serif; color: var(--fg); background: #0e0f13; }
    .photo { position: fixed; inset: 0; z-index: -1; background: center / cover no-repeat; opacity: 0; transform: scale(1.04);
      transition: opacity .8s ease, transform 1.6s cubic-bezier(.16,1,.3,1); }
    .photo.shown { opacity: 1; transform: none; }
    /* A soft shade at the top and bottom keeps the bar and the credit readable on bright photos. */
    .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.08) 40%, rgba(0,0,0,.45)); }
    .credit { position: fixed; left: 16px; bottom: 14px; max-width: min(60%, 520px); padding: 6px 12px; border-radius: 10px;
      color: rgba(255,255,255,.85); background: rgba(0,0,0,.28); backdrop-filter: blur(16px); font-size: 11.5px; line-height: 1.35;
      text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity .8s ease; }
    .credit.shown { opacity: 1; }
    .credit:hover { color: #fff; background: rgba(0,0,0,.45); }
    .bar { width: min(580px, 100%); border-radius: 16px; overflow: hidden;
      background: rgba(28,29,34,.72); backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.45);
      animation: rise .35s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
    form { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; }
    form .material-symbols-outlined { font-size: 21px; color: var(--muted); }
    input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: 16px 'Poppins', sans-serif; }
    input::placeholder { color: var(--muted); }
    .list { padding: 6px; box-shadow: 0 -1px 0 rgba(255,255,255,.07); }
    .label { padding: 8px 12px 4px; font-size: 11px; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; color: inherit; text-decoration: none; font-size: 13.5px; cursor: pointer; }
    .row.selected { background: color-mix(in srgb, var(--tint) 30%, rgba(255,255,255,.06)); }
    .row .badge { display: flex; width: 26px; height: 26px; flex: 0 0 26px; align-items: center; justify-content: center; border-radius: 7px;
      background: rgba(255,255,255,.09); font-size: 12px; font-weight: 600; }
    .row .badge .material-symbols-outlined { font-size: 17px; }
    .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .sub { max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .hint { display: flex; justify-content: flex-end; gap: 14px; padding: 8px 16px 10px; font-size: 11px; color: var(--muted); }
    kbd { padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.08); font: inherit; }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } .photo, .credit { transition: none; transform: none; } }
  </style>
</head>
<body>
  <div class="photo" id="photo" aria-hidden="true"></div>
  <a class="credit" id="credit" hidden></a>
  <main class="bar">
    <form id="search" role="search">
      <span class="material-symbols-outlined">search</span>
      <input id="q" placeholder="Search or enter a website" data-i18n-placeholder="browser.search.placeholder" autocomplete="off" spellcheck="false" autofocus
        role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list">
    </form>
    <div class="list" id="list" role="listbox"></div>
    <div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="browser.hint.move">to move</span></span><span><kbd>Enter</kbd> <span data-i18n="browser.hint.open">to open</span></span></div>
  </main>
  <script>
    const ENGINES = {
      google: { name: 'Google', url: 'https://www.google.com/search?q=' },
      duckduckgo: { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
      bing: { name: 'Bing', url: 'https://www.bing.com/search?q=' }
    };
    let engineId = 'google';
    try { engineId = localStorage.getItem('browserSearchEngine') || 'google'; } catch (e) {}
    const engine = ENGINES[engineId] || ENGINES.google;

    const SHORTCUTS = [
      { name: 'Wikipedia', url: 'https://www.wikipedia.org', badge: 'W' },
      { name: 'YouTube', url: 'https://www.youtube.com', badge: '▶' },
      { name: 'hyadeOS', url: 'https://github.com/hyadeOSS', badge: 'GH' },
      { name: hyadeOSI18n.t("browser.shortcut.maps", "Maps"), url: 'https://www.openstreetmap.org', badge: 'M' }
    ];
    const ADDRESS = /^(?:localhost|\d{1,3}(?:\.\d{1,3}){3}|(?:[a-z0-9-]+\.)+[a-z]{2,})(?::\d+)?(?:[/?#]\S*)?$/i;
    const host = url => url.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');

    const input = document.getElementById('q');
    const list = document.getElementById('list');
    let rows = [], selected = 0;

    function addressFor(value) {
      if (/^https?:\/\//i.test(value)) return value;
      if (ADDRESS.test(value)) return (/^(?:localhost|\d)/i.test(value) ? 'http://' : 'https://') + value;
      return null;
    }

    function build() {
      const value = input.value.trim();
      const query = value.toLowerCase();
      rows = [];
      if (value) {
        const address = addressFor(value);
        rows.push(address
          ? { icon: 'language', name: hyadeOSI18n.t("browser.go-to", "Go to {address}", { address: host(address) }), url: address }
          : { icon: 'search', name: hyadeOSI18n.t("browser.search-for", "Search {engine} for “{query}”", { engine: engine.name, query: value }), url: engine.url + encodeURIComponent(value) });
      }
      const matches = SHORTCUTS.filter(s => !query || s.name.toLowerCase().includes(query) || host(s.url).includes(query));
      list.replaceChildren();
      const add = (row, index) => {
        const a = document.createElement('a');
        a.className = 'row' + (index === selected ? ' selected' : '');
        a.href = row.url;
        a.id = 'row-' + index;
        a.setAttribute('role', 'option');
        a.setAttribute('aria-selected', String(index === selected));
        const badge = document.createElement('span');
        badge.className = 'badge';
        if (row.icon) { const i = document.createElement('span'); i.className = 'material-symbols-outlined'; i.textContent = row.icon; badge.append(i); }
        else badge.textContent = row.badge;
        const name = document.createElement('span'); name.className = 'name'; name.textContent = row.name;
        a.append(badge, name);
        if (!row.icon) { const sub = document.createElement('span'); sub.className = 'sub'; sub.textContent = host(row.url); a.append(sub); }
        a.addEventListener('mousemove', () => { if (selected !== index) { selected = index; build(); } });
        list.append(a);
      };
      rows.forEach(add);
      if (matches.length) {
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = hyadeOSI18n.t("browser.shortcuts", "Shortcuts");
        list.append(label);
        matches.forEach(m => { rows.push(m); add(m, rows.length - 1); });
      }
      list.hidden = !rows.length;
      selected = Math.min(selected, Math.max(0, rows.length - 1));
      input.setAttribute('aria-activedescendant', rows.length ? 'row-' + selected : '');
    }

    input.addEventListener('input', () => { selected = 0; build(); });
    input.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!rows.length) return;
        selected = (selected + (event.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
        build();
      }
    });
    document.getElementById('search').addEventListener('submit', event => {
      event.preventDefault();
      if (rows[selected]) location.href = rows[selected].url;
    });
    build();

    // Random photo: fades in once it has fully loaded; offline it stays plain dark.
    (async () => {
      try {
        const response = await fetch('/api/browser/wallpaper', { cache: 'no-store' });
        const photo = await response.json();
        if (!photo.success) return;
        const img = new Image();
        img.onload = () => {
          const layer = document.getElementById('photo');
          layer.style.backgroundImage = `url("${photo.url.replace(/["\\]/g, '')}")`;
          layer.classList.add('shown');
          const credit = document.getElementById('credit');
          credit.textContent = photo.credit || photo.title;
          credit.title = photo.credit || photo.title;
          if (photo.link) credit.href = photo.link;
          credit.hidden = !credit.textContent;
          requestAnimationFrame(() => credit.classList.add('shown'));
        };
        img.src = photo.url;
      } catch (e) { /* offline: keep the plain background */ }
    })();
  </script>
</body>
</html>
