<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/desktop/assets/i18n-data.js"></script>
  <script src="/desktop/assets/i18n.js"></script>
  <script src="/desktop/assets/accent.js"></script>
<script src="/desktop/assets/mw-theme.js"></script>
<link rel="stylesheet" href="/desktop/assets/mw-design.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="settings.about.title">About hyadeOS</title>

  <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">

  <style>
    #systemVersion { user-select: text; }
    .link-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 9px; color: var(--mw-text); text-decoration: none; transition: background .15s; }
    .link-row:hover { background: rgba(var(--mw-ink), 0.07); }
    .link-icon { display: flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 9px; background: rgba(var(--mw-ink), 0.08); }
    .link-text { display: flex; flex: 1; min-width: 0; flex-direction: column; }
    .link-title { font-size: 14px; font-weight: 500; }
    .link-sub { font-size: 12px; color: rgba(var(--mw-ink), 0.5); }
    .link-status { font-size: 19px !important; }
    .link-status[hidden] { display: none !important; }
    .link-status.pending { color: #ff9f0a; }
    .link-status.done { color: #30d158; }
    .link-arrow { color: rgba(var(--mw-ink), 0.4); }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--mw-text);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 10px 20px !important;
    }

    .container {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Header con il logo ingrandito */
    .brand-header {
      text-align: center;
      padding: 35px 0 25px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-header img {
      max-width: 320px; /* Logo reso più grande */
      height: auto;
      display: block;
    }

    .info-box {
      background: color-mix(in srgb, var(--mw-surface-3) 55%, transparent);
      border: 1px solid rgba(var(--mw-ink), 0.03);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-sizing: border-box;
      width: 100%;
    }

    .info-box:last-child {
      margin-bottom: 0;
    }

    .info-box .title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 10px 0;
      color: var(--mw-text);
    }

    .info-box .content {
      font-size: 13px;
      color: #bbb;
      line-height: 1.7;
    }

    /* Righe informative pulite, senza bordi inferiori */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
    }

    .info-row:last-child {
      padding-bottom: 0;
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row .label {
      font-weight: 500;
      color: rgba(var(--mw-ink), 0.9);
    }

    .info-row .value {
      color: #aaa;
      font-weight: 400;
    }

    /* Killer delle scrollbar */
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
  <link rel="stylesheet" href="/desktop/apps/settings/assets/mw2-settings.css">
</head>
<body>

<div class="container">

  <div class="brand-header">
    <img src="branding.png" alt="hyadeOS">
  </div>

  <div class="info-box">
    <div class="info-row">
      <span class="label" data-i18n="settings.about.version">System version:</span>
      <span class="value" id="systemVersion">1.3.0</span>
    </div>
    <div class="info-row">
      <span class="label" data-i18n="settings.about.kernel">Kernel:</span>
      <span class="value">1.0-wuhuaguo-mst (node)</span>
    </div>
    <div class="info-row">
      <span class="label" data-i18n="settings.about.engine">Engine:</span>
      <span class="value">Lillium Engine</span> <!-- lily ti amo -->
    </div>
    <div class="info-row">
      <span class="label" data-i18n="settings.about.build-date">Build Date:</span>
      <span class="value" id="buildDate">2 October 2026 22:06</span>
    </div>
  </div>

  <div class="info-box">
    <a class="link-row" href="activation.html">
      <span class="link-icon"><span class="material-symbols-outlined">key</span></span>
      <span class="link-text">
        <span class="link-title" data-i18n="settings.about.activation">Activation</span>
        <span class="link-sub" data-i18n="settings.about.activation-sub">Bind your email to this device</span>
      </span>
      <span class="material-symbols-outlined link-status" id="activationStatus" hidden></span>
      <span class="material-symbols-outlined link-arrow">chevron_right</span>
    </a>
  </div>

  <div class="info-box">
    <div class="title" data-i18n="settings.about.credits">Credits</div>
    <div class="content">
      <strong data-i18n="settings.about.main-owner">main owner:</strong> mariowstech<br>
      <strong data-i18n="settings.about.developers">developers:</strong> kianish, davidjone16, ertyplax<br>
      <strong data-i18n="settings.about.contributors">contributors:</strong> kevadesu
    </div>
  </div>

</div>

<script>
  // Activation status next to its arrow: orange info until an email is bound, then a green check.
  (async () => {
    try {
      const data = await (await fetch('/api/activation', { cache: 'no-store' })).json();
      if (!data.success) return;
      const icon = document.getElementById('activationStatus');
      icon.textContent = data.activated ? 'check_circle' : 'info';
      icon.className = 'material-symbols-outlined link-status ' + (data.activated ? 'done' : 'pending');
      icon.title = data.activated ? hyadeOSI18n.t("settings.activation.activated", "hyadeOS is activated") : hyadeOSI18n.t("settings.activation.not-activated", "hyadeOS is not activated");
      icon.hidden = false;
    } catch (e) { /* offline or older kernel: no status icon */ }
  })();

  // Version and build date come from the kernel, so they stay correct on their
  // own. The values written in the markup are only the fallback.
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                  'July', 'August', 'September', 'October', 'November', 'December'];

  function formatBuildDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return null;
    const pad = n => String(n).padStart(2, '0');
    if (hyadeOSI18n.locale) {
      const day = d.toLocaleDateString(hyadeOSI18n.locale, { day: 'numeric', month: 'long', year: 'numeric' });
      return `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  (async () => {
    try {
      const res = await fetch('/api/system/about', { cache: 'no-store' });
      if (!res.ok) return;
      const info = await res.json();
      if (info.version) document.getElementById('systemVersion').textContent = info.version;
      const built = formatBuildDate(info.buildDate);
      if (built) document.getElementById('buildDate').textContent = built;
    } catch (err) {
      // Older kernel or no connection: keep the values from the markup.
    }
  })();
</script>

</body>
</html>
